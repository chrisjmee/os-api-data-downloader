<title>NGD Data Linkages Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="How OS National Geographic Database features link to each other and to partner data - by OSID, UPRN, USRN, postcode and GSS code - with use cases and the difference between the API and Select+Build.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a map-sheet header strip, then a two-pane workbench - an index on the left, the selected
   feature / key / use case on the right; the route finder and delivery guide use the full width.
   Relationship families are colour-coded the same way everywhere. */
:root {
  --paper: #f3f5f2; --panel: #ffffff; --sunk: #e9ece7; --ink: #16212a; --muted: #56636c; --line: #d5dad3;
  --accent: #0a6b6b; --accent-soft: #d9ecea; --on-accent: #ffffff; --node: #ffffff;
  --f-within: #8a4f12; --f-within-soft: #f4eadf;
  --f-network: #17773f; --f-network-soft: #e0f1e7;
  --f-same: #1559b8; --f-same-soft: #e3ecf9;
  --f-access: #b34700; --f-access-soft: #fbe8dc;
  --f-hierarchy: #7a3f9e; --f-hierarchy-soft: #f1e6f8;
  --warn: #8a5a00; --warn-soft: #fbf0d6;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1519; --panel: #161f25; --sunk: #1c262d; --ink: #e4ebe8; --muted: #9caab2; --line: #2b3840;
    --accent: #5cc8c2; --accent-soft: #163a3b; --on-accent: #08201f; --node: #1c262d;
    --f-within: #e5ae6e; --f-within-soft: #3a2a17; --f-network: #7ad69b; --f-network-soft: #17321f;
    --f-same: #8ab8ff; --f-same-soft: #1b2b44; --f-access: #ffa45c; --f-access-soft: #40260f;
    --f-hierarchy: #d3a6f0; --f-hierarchy-soft: #33223f; --warn: #f0c060; --warn-soft: #3a2f12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1519; --panel: #161f25; --sunk: #1c262d; --ink: #e4ebe8; --muted: #9caab2; --line: #2b3840;
  --accent: #5cc8c2; --accent-soft: #163a3b; --on-accent: #08201f; --node: #1c262d;
  --f-within: #e5ae6e; --f-within-soft: #3a2a17; --f-network: #7ad69b; --f-network-soft: #17321f;
  --f-same: #8ab8ff; --f-same-soft: #1b2b44; --f-access: #ffa45c; --f-access-soft: #40260f;
  --f-hierarchy: #d3a6f0; --f-hierarchy-soft: #33223f; --warn: #f0c060; --warn-soft: #3a2f12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, code { font-family: var(--mono); font-size: 0.85em; }
.muted { color: var(--muted); }
p { max-width: 75ch; }

.sheet { border-bottom: 1px solid var(--line); background: var(--panel); }
.sheet-in, .main, footer { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-in { padding-block: 18px 0; display: grid; gap: 10px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 3.2vw, 2.2rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.grid-ref { font-family: var(--mono); font-size: 0.76rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.lede { margin: 0; max-width: 78ch; color: var(--muted); }
.keyrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 0.85rem; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 4px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer;
  font-family: var(--display); font-weight: 600; font-size: 1.02rem; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

.main { padding-block: 20px 40px; }
.bench { display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); gap: 20px; align-items: start; }
.bench.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 820px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.index { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column;
  max-height: calc(100vh - 40px); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); min-width: 0; }
@media (max-width: 820px) { .index { position: static; max-height: 46vh; } }
.search { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.search input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.list { overflow-y: auto; padding: 6px 0 10px; }
.group { font-family: var(--display); font-weight: 600; font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); padding: 12px 14px 4px; display: flex; justify-content: space-between; gap: 8px; }
.item { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; text-align: left;
  background: none; border: 0; border-left: 3px solid transparent; padding: 5px 12px 5px 11px; cursor: pointer; }
.item:hover { background: var(--sunk); }
.item[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.item .n { font-family: var(--mono); font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item .sub { display: block; font-size: 0.8rem; color: var(--muted); }

.detail { min-width: 0; display: grid; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; min-width: 0; }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 1.7rem; line-height: 1.15; margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin: 0 0 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 0.88rem; color: var(--muted); align-items: center; }
.facts b { color: var(--ink); font-weight: 500; }
.note { margin: 12px 0 0; padding: 10px 12px; background: var(--sunk); border-radius: 4px; font-size: 0.92rem; max-width: 80ch; }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.lead { font-size: 1.05rem; margin: 10px 0 0; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; font-size: 0.79rem;
  font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.fam-within { background: var(--f-within-soft); color: var(--f-within); }
.fam-network { background: var(--f-network-soft); color: var(--f-network); }
.fam-same { background: var(--f-same-soft); color: var(--f-same); }
.fam-access { background: var(--f-access-soft); color: var(--f-access); }
.fam-hierarchy { background: var(--f-hierarchy-soft); color: var(--f-hierarchy); }
.chip.key { font-family: var(--mono); font-size: 0.74rem; background: var(--accent-soft); color: var(--accent); cursor: pointer; letter-spacing: 0.02em; }
.chip.key:hover { border-color: var(--accent); }
.chip.feat { background: var(--sunk); color: var(--ink); cursor: pointer; border-color: var(--line); }
.chip.feat:hover { border-color: var(--accent); }
.chip.route-api { background: var(--f-network-soft); color: var(--f-network); }
.chip.route-sb { background: var(--f-same-soft); color: var(--f-same); }
.chip.route-external { background: var(--f-hierarchy-soft); color: var(--f-hierarchy); }
.chip.old { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.diagram { overflow-x: auto; margin: 0 -6px; }
.diagram svg { display: block; width: 100%; min-width: 560px; height: auto; }
.diagram text { fill: var(--ink); font-family: var(--display); font-size: 13px; }
.diagram .node rect { fill: var(--node); stroke: var(--line); }
.diagram .node { cursor: pointer; }
.diagram .node:hover rect, .diagram .node:focus rect { stroke: var(--accent); stroke-width: 2; }
.diagram .centre rect { fill: var(--accent); stroke: var(--accent); }
.diagram .centre text { fill: var(--on-accent); font-weight: 700; }
.diagram .edge { fill: none; stroke-width: 2; }
.diagram .e-within { stroke: var(--f-within); } .diagram .e-network { stroke: var(--f-network); }
.diagram .e-same { stroke: var(--f-same); } .diagram .e-access { stroke: var(--f-access); }
.diagram .e-hierarchy { stroke: var(--f-hierarchy); }
.diagram .count { fill: var(--muted); font-family: var(--mono); font-size: 11px; }

.rels { display: grid; }
.rel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 12px 0; border-top: 1px solid var(--line); }
.rel:first-child { border-top: 0; }
.rel .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.rel .path { font-weight: 500; }
.join { font-family: var(--mono); font-size: 0.82rem; background: var(--sunk); padding: 3px 8px; border-radius: 4px; overflow-x: auto; white-space: nowrap; max-width: 100%; }
.join .eq { color: var(--muted); }
.rel .meta { font-size: 0.84rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.linkto { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font: inherit; font-weight: 500; }
.empty { color: var(--muted); font-style: italic; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--display); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-weight: 500; white-space: nowrap; }
.compare td { width: 40%; } .compare td:first-child { width: 20%; }

.answers { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; max-width: 80ch; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps .no { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }

.pathform { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: end; }
@media (max-width: 640px) { .pathform { grid-template-columns: minmax(0, 1fr); } .pathform .arrow { display: none; } }
label.f { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); min-width: 0; }
select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.arrow { font-family: var(--display); font-size: 1.4rem; color: var(--muted); padding-bottom: 6px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 0.88rem; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; }
.keychain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 0.88rem; color: var(--muted); }
.split { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .split { grid-template-columns: minmax(0, 1fr); } }
.stat { font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 0.86rem; color: var(--muted); margin: 4px 0 10px; }
ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; max-width: 80ch; }
ul.plain.full { max-width: none; }
a { color: var(--accent); }

footer { padding-block: 0 32px; font-size: 0.82rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .item, .tab, .chip.feat, .chip.key { transition: background-color .12s, color .12s, border-color .12s; } }
</style>

<header class="sheet">
  <div class="sheet-in">
    <div class="titlerow">
      <h1>NGD Data Linkages Explorer</h1>
      <span class="grid-ref" id="stamp"></span>
    </div>
    <p class="lede">How OS National Geographic Database features join to each other and to partner data – which
      field holds which identifier, whether that's an OSID, UPRN, USRN, postcode or GSS code – and the everyday
      questions those joins answer. Nothing to install and no data to download.</p>
    <div class="keyrow" id="key"></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" aria-selected="true" data-view="cases">Use cases</button>
      <button class="tab" role="tab" aria-selected="false" data-view="types">Feature types</button>
      <button class="tab" role="tab" aria-selected="false" data-view="keys">Linking keys</button>
      <button class="tab" role="tab" aria-selected="false" data-view="route">Find a route</button>
      <button class="tab" role="tab" aria-selected="false" data-view="delivery">APIs or Select+Build?</button>
    </nav>
  </div>
</header>

<main class="main">
  <div class="bench" id="bench">
    <aside class="index" id="index" aria-label="Index">
      <div class="search">
        <input id="q" type="search" placeholder="Search…" autocomplete="off" aria-label="Search">
        <label class="check" for="old" id="oldwrap"><input type="checkbox" id="old"> Include older schema versions</label>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
</main>
<footer id="foot"></footer>

<script>
const D = /*__DATA__*/null;
const F = D.features, E = D.edges, K = Object.fromEntries(D.keys.map(k => [k.id, k]));
const byId = Object.fromEntries(E.map(e => [e.id, e]));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const title = f => (F[f] && F[f].title) || f;
const ROUTE = {api: "OS Select+Build and OS NGD APIs", sb: "OS Select+Build only", external: "Partner data"};
const state = {view: "cases", type: "Building", key: "uprn", kase: 0, q: "", old: false, ext: true, from: "BuiltAddress", to: "RoadLink"};

const live = () => E.filter(e => state.old || !e.old);
const relsOf = f => live().filter(e => e.s === f || e.t === f);
const famChip = e => `<span class="chip fam-${e.family}">${esc(e.type)}</span>`;
const keyChip = k => K[k] ? `<button class="chip key" data-key="${esc(k)}">${esc(K[k].name)}</button>` : "";
const featChip = f => `<button class="chip feat" data-type="${esc(f)}">${esc(title(f))}</button>`;
const routeChip = f => `<span class="chip route-${F[f].route}">${esc(F[f].route === "external" ? "From " + F[f].org : ROUTE[F[f].route])}</span>`;
const joinCode = e => `<div class="join"><span>${esc(e.s)}.${esc(e.sf)}</span> <span class="eq">=</span> <span>${esc(e.t)}.${esc(e.tf)}</span></div>`;

// ------------------------------------------------------------------ header
(function header() {
  const nAPI = Object.values(F).filter(f => f.route === "api").length;
  document.getElementById("stamp").textContent =
    `${Object.keys(F).length} features · ${E.length} relationships · ${D.keys.length} linking keys · ${D.cases.length} use cases`;
  document.getElementById("key").innerHTML = "<span>Relationships:</span>" +
    Object.entries(D.families).map(([id, [name, text]]) => `<span class="chip fam-${id}" title="${esc(text)}">${esc(name)}</span>`).join("");
  document.getElementById("foot").innerHTML =
    `Relationships from OS's UK Geospatial Entity Relationships model (${D.source.rows} rows), built ${esc(D.built)}. ` +
    `${nAPI} of the features shown are served by the OS NGD API – Features. Check each product's documentation and licence before relying on a join.`;
})();

// ------------------------------------------------------------------ index
function themesOf() {
  const t = {};
  for (const [id, f] of Object.entries(F)) (t[f.theme || "Other"] ||= []).push(id);
  for (const k in t) t[k].sort((a, b) => title(a).localeCompare(title(b)));
  return Object.entries(t).sort((a, b) => a[0].localeCompare(b[0]));
}
function renderList() {
  const q = state.q.trim().toLowerCase(), el = document.getElementById("list");
  let h = "";
  if (state.view === "types") {
    for (const [theme, ids] of themesOf()) {
      const items = ids.filter(id => !q || (title(id) + " " + id + " " + F[id].org + " " + F[id].subtheme).toLowerCase().includes(q)
        || relsOf(id).some(e => (e.sf + " " + e.tf).toLowerCase().includes(q)));
      if (!items.length) continue;
      h += `<div class="group"><span>${esc(theme)}</span><span>${items.length}</span></div>`;
      for (const id of items) {
        const n = relsOf(id).length;
        h += `<button class="item" data-type="${esc(id)}" aria-current="${state.type === id}"><span>${esc(title(id))}` +
          (F[id].org !== "Ordnance Survey" ? `<span class="sub">${esc(F[id].org)}</span>` : "") +
          `</span><span class="n">${n}</span></button>`;
      }
    }
  } else if (state.view === "keys") {
    for (const k of D.keys) {
      if (q && !(k.name + " " + k.full + " " + k.what).toLowerCase().includes(q)) continue;
      h += `<button class="item" data-key="${esc(k.id)}" aria-current="${state.key === k.id}"><span>${esc(k.name)}<span class="sub">${esc(k.full)}</span></span><span class="n">${k.count}</span></button>`;
    }
  } else if (state.view === "cases") {
    D.cases.forEach((c, i) => {
      if (q && !(c.title + " " + c.who + " " + c.summary + " " + c.answers.join(" ")).toLowerCase().includes(q)) return;
      h += `<button class="item" data-case="${i}" aria-current="${state.kase === i}"><span>${esc(c.title)}<span class="sub">${esc(c.who)}</span></span></button>`;
    });
  }
  el.innerHTML = h || `<p class="empty" style="padding:0 14px">Nothing matches “${esc(state.q)}”.</p>`;
}

// ------------------------------------------------------------------ one relationship
function relRow(e, from) {
  const other = e.s === from ? e.t : e.s;
  const meta = [`Join: ${esc(e.join)}`, `Owner: ${esc(e.owners.join(", ") || "not stated")}`, `Updated: ${esc(e.freq || "not stated")}`,
    `Versions: ${esc(title(e.s))} v${esc(e.sv)} → ${esc(title(e.t))} v${esc(e.tv)}`];
  return `<div class="rel"><div class="head">${famChip(e)} ${keyChip(e.key)} ${e.old ? '<span class="chip old">Older schema version</span>' : ""}</div>
    <div class="path">${from ? (e.s === from ? `${esc(title(from))} → <button class="linkto" data-type="${esc(other)}">${esc(title(other))}</button>`
      : `<button class="linkto" data-type="${esc(other)}">${esc(title(other))}</button> → ${esc(title(from))}`)
      : `<button class="linkto" data-type="${esc(e.s)}">${esc(title(e.s))}</button> → <button class="linkto" data-type="${esc(e.t)}">${esc(title(e.t))}</button>`}</div>
    ${joinCode(e)}<div class="meta">${meta.map(m => `<span>${m}</span>`).join("")}</div>
    ${e.purpose ? `<div class="note">${esc(e.purpose)}</div>` : ""}</div>`;
}

// ------------------------------------------------------------------ feature view
function renderType() {
  const id = state.type, f = F[id], rs = relsOf(id);
  const out = rs.filter(e => e.s === id), inn = rs.filter(e => e.t === id && e.s !== id);
  let h = `<article class="card"><p class="eyebrow">${esc(f.theme)}${f.subtheme ? " · " + esc(f.subtheme) : ""}</p><h2>${esc(f.title)}</h2>
    <div class="facts"><span>Organisation <b>${esc(f.org)}</b></span>` +
    (f.pk ? `<span>Primary key ${K[f.pk] ? keyChip(f.pk) : `<b class="mono">${esc(f.pk)}</b>`}</span>` : "") +
    (f.versions.length ? `<span>Schema version${f.versions.length > 1 ? "s" : ""} <b>${esc(f.versions.join(", "))}</b></span>` : "") +
    `</div><div class="facts"><span>Get it from</span> ${routeChip(id)}${f.api ? ` <span class="mono">${esc(f.api)}</span>` : ""}</div></article>`;
  if (rs.length) h += `<article class="card"><h3>Joins to</h3><div class="diagram">${ego(id, rs)}</div>
    <p class="muted" style="margin:8px 0 0;font-size:.86rem">Select a feature to move to it. Colours show the kind of relationship; numbers show more than one join.</p></article>`;
  if (out.length) h += `<article class="card"><h3>${esc(f.title)} holds the key to…</h3><div class="rels">${out.map(e => relRow(e, id)).join("")}</div></article>`;
  if (inn.length) h += `<article class="card"><h3>…and these hold a key to ${esc(f.title)}</h3><div class="rels">${inn.map(e => relRow(e, id)).join("")}</div></article>`;
  if (!rs.length) h += `<article class="card"><p class="empty">No ${state.old ? "" : "current "}relationships recorded for this feature${state.old ? "" : " – tick ‘Include older schema versions’ to see older ones"}.</p></article>`;
  const used = D.cases.map((c, i) => [c, i]).filter(([c]) => c.steps.some(s => byId[s].s === id || byId[s].t === id));
  if (used.length) h += `<article class="card"><h3>Use cases that need it</h3><div class="chips">` +
    used.map(([c, i]) => `<button class="chip feat" data-case="${i}">${esc(c.title)}</button>`).join("") + `</div></article>`;
  return h;
}
function ego(id, rs) {
  const groups = new Map();
  for (const e of rs) {
    const o = e.s === id ? e.t : e.s;
    if (o === id) continue;
    const g = groups.get(o) || {fam: {}, n: 0};
    g.n++; g.fam[e.family] = (g.fam[e.family] || 0) + 1; groups.set(o, g);
  }
  const others = [...groups.keys()].sort((a, b) => title(a).localeCompare(title(b)));   // A to Z, down the left then the right
  const W = 780, n = others.length, half = Math.ceil(n / 2), rowH = 36;
  const H = Math.max(120, half * rowH + 36), cx = W / 2, cy = H / 2;
  let edges = "", nodes = "";
  others.forEach((o, i) => {
    const left = i < half, k = left ? i : i - half, count = left ? half : n - half;
    const x = left ? 108 : W - 108, y = cy + (k - (count - 1) / 2) * rowH;
    const g = groups.get(o), fam = Object.entries(g.fam).sort((p, q) => q[1] - p[1])[0][0];
    const ex = left ? x + 92 : x - 92;
    edges += `<path class="edge e-${fam}" d="M${cx},${cy} C${(cx + ex) / 2},${cy} ${(cx + ex) / 2},${y.toFixed(1)} ${ex},${y.toFixed(1)}"/>`;
    if (g.n > 1) edges += `<text class="count" x="${(left ? ex + 6 : ex - 6).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="${left ? "start" : "end"}">×${g.n}</text>`;
    const label = title(o);
    nodes += `<g class="node" data-type="${esc(o)}" tabindex="0" role="button" aria-label="${esc(label)}"><rect x="${x - 92}" y="${(y - 13).toFixed(1)}" width="184" height="26" rx="13"/>` +
      `<text x="${x}" y="${(y + 4.5).toFixed(1)}" text-anchor="middle">${esc(label.length > 25 ? label.slice(0, 24) + "…" : label)}</text></g>`;
  });
  const cl = title(id), cw = Math.min(240, 28 + cl.length * 8.4);
  nodes += `<g class="centre"><rect x="${cx - cw / 2}" y="${cy - 18}" width="${cw}" height="36" rx="18"/><text x="${cx}" y="${cy + 5}" text-anchor="middle" style="font-size:15px">${esc(cl.length > 26 ? cl.slice(0, 25) + "…" : cl)}</text></g>`;
  const self = rs.filter(e => e.s === id && e.t === id).length;
  if (self) nodes += `<text class="count" x="${cx}" y="${cy + 40}" text-anchor="middle">+ ${self} join${self > 1 ? "s" : ""} to itself</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Features joined to ${esc(cl)}">${edges}${nodes}</svg>`;
}

// ------------------------------------------------------------------ linking key view
function renderKey() {
  const k = K[state.key], rs = live().filter(e => e.key === k.id);
  const carriers = [...new Set(rs.map(e => e.s))].sort((a, b) => title(a).localeCompare(title(b)));
  const holders = [...new Set(rs.map(e => e.t))].sort((a, b) => title(a).localeCompare(title(b)));
  let h = `<article class="card"><p class="eyebrow">Linking key</p><h2>${esc(k.name)}</h2><p class="lead">${esc(k.full)}</p>
    <div class="facts"><span>Issued by <b>${esc(k.who)}</b></span>${k.format ? `<span>Format <b>${esc(k.format)}</b></span>` : ""}</div>
    <p>${esc(k.what)}</p><p><b>Why it matters:</b> ${esc(k.use)}</p><p class="note"><b>Where to get it:</b> ${esc(k.open)}</p></article>`;
  h += `<article class="card"><h3>Who holds it</h3><div class="split" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <div><div class="stat">${holders.length}</div><div class="stat-label">feature${holders.length === 1 ? "" : "s"} identified by it</div><div class="chips">${holders.map(featChip).join("")}</div></div>
    <div><div class="stat">${carriers.length}</div><div class="stat-label">feature${carriers.length === 1 ? "" : "s"} that point to it</div><div class="chips">${carriers.map(featChip).join("")}</div></div></div></article>`;
  h += `<article class="card"><h3>Every join on ${esc(k.name)} (${rs.length})</h3><div class="tablewrap"><table><thead><tr><th>From (field holding the key)</th><th>To (field it matches)</th><th>Relationship</th></tr></thead><tbody>` +
    rs.map(e => `<tr><td><button class="linkto" data-type="${esc(e.s)}">${esc(title(e.s))}</button><div class="mono muted">${esc(e.sf)}</div></td>
      <td><button class="linkto" data-type="${esc(e.t)}">${esc(title(e.t))}</button><div class="mono muted">${esc(e.tf)}</div></td><td>${famChip(e)}</td></tr>`).join("") +
    `</tbody></table></div></article>`;
  return h;
}

// ------------------------------------------------------------------ use case view
function renderCase() {
  const c = D.cases[state.kase], steps = c.steps.map(s => byId[s]);
  const feats = [...new Set(steps.flatMap(e => [e.s, e.t]))];
  const keys = [...new Set(steps.map(e => e.key))];
  let h = `<article class="card"><p class="eyebrow">Use case</p><h2>${esc(c.title)}</h2><p class="lead">${esc(c.summary)}</p>
    <div class="facts"><span>Useful for <b>${esc(c.who)}</b></span></div>
    <div class="keychain"><span>Keys used</span> ${keys.map(keyChip).join("")}</div></article>`;
  h += `<article class="card"><h3>Questions it answers</h3><ul class="answers">${c.answers.map(a => `<li>${esc(a)}</li>`).join("")}</ul></article>`;
  h += `<article class="card"><h3>The joins</h3><ol class="steps">` + steps.map((e, i) =>
    `<li><span class="no">${i + 1}</span><div>${relRow(e, null).replace('<div class="rel">', '<div class="rel" style="padding:0;border:0">')}</div></li>`).join("") + `</ol></article>`;
  h += `<article class="card"><h3>Data you need</h3><div class="tablewrap"><table><thead><tr><th>Feature</th><th>Get it from</th></tr></thead><tbody>` +
    feats.map(f => `<tr><td><button class="linkto" data-type="${esc(f)}">${esc(title(f))}</button></td><td>${routeChip(f)}</td></tr>`).join("") +
    `</tbody></table></div>${c.watch ? `<p class="note warn"><b>Watch out:</b> ${esc(c.watch)}</p>` : ""}</article>`;
  return h;
}

// ------------------------------------------------------------------ route finder
function findRoute(a, z) {
  if (a === z) return [];
  const prev = new Map([[a, null]]), q = [a];
  const rs = live().filter(e => state.ext || (F[e.s].org === "Ordnance Survey" && F[e.t].org === "Ordnance Survey"));
  while (q.length) {
    const cur = q.shift();
    for (const e of rs) {
      let nxt, dir;
      if (e.s === cur) { nxt = e.t; dir = "out"; } else if (e.t === cur) { nxt = e.s; dir = "in"; } else continue;
      if (prev.has(nxt)) continue;
      prev.set(nxt, [cur, e, dir]);
      if (nxt === z) { const out = []; let k = z; while (prev.get(k)) { const [p, ee, d] = prev.get(k); out.unshift([ee, d, p, k]); k = p; } return out; }
      q.push(nxt);
    }
  }
  return null;
}
function options(sel) {
  return themesOf().map(([th, ids]) => `<optgroup label="${esc(th)}">` + ids.map(id => `<option value="${esc(id)}"${id === sel ? " selected" : ""}>${esc(title(id))}</option>`).join("") + `</optgroup>`).join("");
}
function renderRoute() {
  const a = state.from, z = state.to, steps = findRoute(a, z);
  let h = `<article class="card"><p class="eyebrow">Route finder</p><h2>How do I get from one feature to another?</h2>
    <p class="muted">The shortest chain of joins between any two features, with the field and key used at each step. Joins can be followed in either direction.</p>
    <div class="pathform"><label class="f" for="from">From<select id="from">${options(a)}</select></label><span class="arrow" aria-hidden="true">→</span>
    <label class="f" for="to">To<select id="to">${options(z)}</select></label></div>
    <div class="checks"><label class="check" for="ext"><input type="checkbox" id="ext"${state.ext ? " checked" : ""}> Include partner data (Land Registry, VOA, ONS…)</label>
    <label class="check" for="old2"><input type="checkbox" id="old2"${state.old ? " checked" : ""}> Include older schema versions</label></div></article><article class="card">`;
  if (steps === null) h += `<h3>No route</h3><p class="empty">${esc(title(a))} and ${esc(title(z))} aren't joined by any chain of relationships${state.ext ? "" : " within OS data – try including partner data"}.</p>`;
  else if (!steps.length) h += `<h3>Same feature</h3><p class="empty">Pick two different features.</p>`;
  else {
    h += `<h3>${steps.length} join${steps.length > 1 ? "s" : ""}: ${[a, ...steps.map(s => s[3])].map(f => esc(title(f))).join(" → ")}</h3>
      <div class="keychain"><span>Keys</span> ${steps.map(s => keyChip(s[0].key)).join(' <span aria-hidden="true">→</span> ')}</div><ol class="steps" style="margin-top:12px">` +
      steps.map(([e, d, p, k], i) => `<li><span class="no">${i + 1}</span><div><div class="head" style="display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center">
        <b>${esc(title(p))} → ${esc(title(k))}</b> ${famChip(e)} ${keyChip(e.key)}</div>
        <div class="muted" style="font-size:.86rem;margin:4px 0">${d === "out" ? `${esc(title(p))} holds the ${esc(K[e.key] ? K[e.key].name : e.key)} of the ${esc(title(k))}` : `${esc(title(k))} holds the ${esc(K[e.key] ? K[e.key].name : e.key)} of the ${esc(title(p))} – follow it backwards`}.</div>${joinCode(e)}</div></li>`).join("") + `</ol>`;
  }
  return h + `</article>`;
}

// ------------------------------------------------------------------ API or Select+Build
function renderDelivery() {
  const d = D.delivery, groups = {api: [], sb: [], external: []};
  for (const [id, f] of Object.entries(F)) groups[f.route].push(id);
  for (const g in groups) groups[g].sort((a, b) => title(a).localeCompare(title(b)));
  let h = `<article class="card"><p class="eyebrow">Getting the data</p><h2>OS NGD APIs or OS Select+Build?</h2>
    <p class="lead">Both give you the same OS NGD features and the same keys to join them. They differ in how much you get, how it arrives and how it stays up to date.</p></article>`;
  h += `<article class="card"><div class="tablewrap"><table class="compare"><thead><tr><th></th><th>OS NGD APIs</th><th>OS Select+Build</th></tr></thead><tbody>` +
    d.rows.map(([a, b, c]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td><td>${esc(c)}</td></tr>`).join("") + `</tbody></table></div></article>`;
  h += `<article class="card"><h3>What it means for linking</h3><ul class="plain full">${d.linking.map(x => `<li>${esc(x)}</li>`).join("")}</ul></article>`;
  h += `<article class="card"><h3>The features in this model, by where to get them</h3><div class="split">` +
    [["api", "OS Select+Build and OS NGD APIs"], ["sb", "OS Select+Build only"], ["external", "Partner data – from the organisation named"]].map(([g, label]) =>
      `<div><div class="stat">${groups[g].length}</div><div class="stat-label">${esc(label)}</div><div class="chips">${groups[g].map(featChip).join("")}</div></div>`).join("") +
    `</div><p class="muted" style="font-size:.86rem;margin:12px 0 0">‘OS Select+Build only’ means the feature isn't served by OS NGD API – Features; some (such as boundaries and catchments) can still be seen as map layers in OS NGD API – Tiles.</p></article>`;
  h += `<article class="card"><h3>Sources</h3><ul class="plain">${d.sources.map(([t, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ul></article>`;
  return h;
}

// ------------------------------------------------------------------ wiring
function render() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === state.view)));
  const wide = state.view === "route" || state.view === "delivery";
  document.getElementById("index").hidden = wide;
  document.getElementById("bench").classList.toggle("wide", wide);
  document.getElementById("oldwrap").hidden = state.view !== "types" && state.view !== "keys";
  document.getElementById("old").checked = state.old;
  document.getElementById("q").placeholder = {types: "Search features and fields…", keys: "Search keys…", cases: "Search use cases…"}[state.view] || "Search…";
  renderList();
  const v = state.view;
  document.getElementById("detail").innerHTML = v === "types" ? renderType() : v === "keys" ? renderKey() : v === "cases" ? renderCase() : v === "route" ? renderRoute() : renderDelivery();
  const hash = v === "types" ? "feature-" + state.type : v === "keys" ? "key-" + state.key : v === "cases" ? "case-" + D.cases[state.kase].id : v;
  try { history.replaceState(null, "", "#" + hash); } catch (e) { /* some frames refuse */ }
}
function go(patch) { Object.assign(state, patch); render(); document.getElementById("detail").scrollIntoView({block: "nearest"}); }
document.addEventListener("click", e => {
  const tab = e.target.closest(".tab"); if (tab) return go({view: tab.dataset.view, q: (document.getElementById("q").value = "")});
  const ty = e.target.closest("[data-type]"); if (ty && F[ty.dataset.type]) return go({view: "types", type: ty.dataset.type});
  const ky = e.target.closest("[data-key]"); if (ky && K[ky.dataset.key]) return go({view: "keys", key: ky.dataset.key});
  const cs = e.target.closest("[data-case]"); if (cs) return go({view: "cases", kase: +cs.dataset.case});
});
document.addEventListener("keydown", e => {
  const n = e.target.closest && e.target.closest(".node");
  if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); go({view: "types", type: n.dataset.type}); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "from") go({from: e.target.value});
  if (id === "to") go({to: e.target.value});
  if (id === "ext") go({ext: e.target.checked});
  if (id === "old" || id === "old2") go({old: e.target.checked});
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
(function start() {
  const h = decodeURIComponent((location.hash || "").slice(1));
  if (h.startsWith("feature-") && F[h.slice(8)]) Object.assign(state, {view: "types", type: h.slice(8)});
  else if (h.startsWith("key-") && K[h.slice(4)]) Object.assign(state, {view: "keys", key: h.slice(4)});
  else if (h.startsWith("case-")) { const i = D.cases.findIndex(c => c.id === h.slice(5)); if (i >= 0) Object.assign(state, {view: "cases", kase: i}); }
  else if (h === "route" || h === "delivery") state.view = h;
  render();
})();
</script>
