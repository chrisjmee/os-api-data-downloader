# OS NGD Data Linkages Explorer - published to GitHub Pages.
# Rebuilds the OS NGD Data Linkages Explorer web page from OS's relationship model (explorer/) and publishes it on
# GitHub Pages: https://<owner>.github.io/<repo>/ngd-links/
# Also builds the React app (react-explorer/) from the same data: https://<owner>.github.io/<repo>/ngd-links-app/
# One-off set-up: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish OS NGD Data Linkages Explorer

on:
  push:
    branches: [main]
    paths:
      - "os_api_data_downloader/data/ngd_feature_types.csv"
      - "explorer/**"
      - "os_api_data_downloader/data/os_relationships.csv"
      - "os_api_data_downloader/core/ngd_model.py"
      - "react-explorer/**"
      - ".github/workflows/explorer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the page
        run: |
          python explorer/build_explorer.py
          python explorer/export_ngd_hierarchy.py
          python explorer/export_react_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-explorer/package-lock.json
      - name: Build the React app
        working-directory: react-explorer
        run: |
          npm ci
          npm run build
          cp -r dist ../docs/ngd-links-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ngd-links/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
